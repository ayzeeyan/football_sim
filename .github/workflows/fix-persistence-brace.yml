name: Repair persistence syntax

on:
  push:
    branches:
      - audit/repo-hardening-2026-09-10

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/repo-hardening-2026-09-10
      - name: Repair dropped brace and format
        shell: python
        run: |
          from pathlib import Path
          p = Path('backend_go/pkg/persistence/persistence.go')
          text = p.read_text()
          broken = '''\t\t\t\t\t\tif destClub, ok := tm.Clubs[targetClubID]; ok {
          \t\t\t\t\t\t\tdestClub.Squad = append(destClub.Squad, livePlayer)
          \t\t\t\t\t\t}
          \t\t\t\t} else {'''
          fixed = '''\t\t\t\t\t\tif destClub, ok := tm.Clubs[targetClubID]; ok {
          \t\t\t\t\t\t\tdestClub.Squad = append(destClub.Squad, livePlayer)
          \t\t\t\t\t\t}
          \t\t\t\t\t}
          \t\t\t\t} else {'''
          if broken in text:
              p.write_text(text.replace(broken, fixed, 1))
      - name: Format and verify
        run: |
          cd backend_go
          gofmt -w pkg/persistence/persistence.go
          go test ./pkg/persistence ./pkg/server ./cmd/server
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend_go/pkg/persistence/persistence.go
          if git diff --cached --quiet; then
            echo "No repair needed"
            exit 0
          fi
          git commit -m "fix(persistence): restore dropped roster-sync brace"
          git push origin HEAD:audit/repo-hardening-2026-09-10
