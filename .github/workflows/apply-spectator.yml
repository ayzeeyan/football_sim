name: Apply spectator implementation

on:
  push:
    branches: [feature/autonomous-spectator-universe]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'chore: apply autonomous spectator implementation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/autonomous-spectator-universe
          fetch-depth: 0
      - name: Apply recovered implementation
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/spectator_patch.b64 <<'PAYLOAD'
          [...truncated by tool...] 
          PAYLOAD
          base64 -d /tmp/spectator_patch.b64 > /tmp/spectator_patch.tgz
          echo '13a44c7dc405f3eba5330aa4f7ab1ecc1d11dfea875d3fb817a1c035e33cea9f  /tmp/spectator_patch.tgz' | sha256sum -c -
          tar -xzf /tmp/spectator_patch.tgz -C .
          rm -f .github/workflows/temp-export.yml .github/workflows/apply-spectator.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: autonomous spectator universe simulator'
          git push origin HEAD:feature/autonomous-spectator-universe
